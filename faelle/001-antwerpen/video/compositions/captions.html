    <div id="cp1" class="cap clip" data-start="2.04" data-duration="0.86"><span class="pill">Ein Tresor,</span></div>
    <div id="cp2" class="cap clip" data-start="2.91" data-duration="1.89"><span class="pill">der als unknackbar galt.</span></div>
    <div id="cp3" class="cap clip" data-start="5.07" data-duration="0.9"><span class="pill">Und am Ende</span></div>

    <div id="cp6" class="cap clip" data-start="10.76" data-duration="0.87"><span class="pill">Antwerpen,</span></div>
    <div id="cp7" class="cap clip" data-start="11.64" data-duration="0.74"><span class="pill">Belgien.</span></div>
    <div id="cp8" class="cap clip" data-start="12.61" data-duration="2.34"><span class="pill">Die Hauptstadt des Diamantenhandels.</span></div>
    <div id="cp9" class="cap clip" data-start="15.22" data-duration="1.58"><span class="pill">Unter dem Antwerp Diamond</span></div>
    <div id="cp10" class="cap clip" data-start="16.81" data-duration="1.36"><span class="pill">Centre liegt ein Tresor</span></div>
    <div id="cp11" class="cap clip" data-start="18.18" data-duration="1.96"><span class="pill">mit 160 Schließfächern.</span></div>
    <div id="cp12" class="cap clip" data-start="20.42" data-duration="1.92"><span class="pill">Geschützt durch ein Zahlenschloss,</span></div>

    <div id="cp15" class="cap clip" data-start="24.29" data-duration="1.92"><span class="pill">ein seismisches Messgerät</span></div>

    <div id="cp17" class="cap clip" data-start="28.05" data-duration="1.23"><span class="pill">Rund zwei Jahre vorher</span></div>
    <div id="cp18" class="cap clip" data-start="29.29" data-duration="1.64"><span class="pill">mietet ein Italiener ein</span></div>

    <div id="cp20" class="cap clip" data-start="32.55" data-duration="2.03"><span class="pill">Leonardo Notarbartolo.</span></div>
    <div id="cp21" class="cap clip" data-start="34.82" data-duration="1.98"><span class="pill">Angeblich Diamantenhändler.</span></div>
    <div id="cp22" class="cap clip" data-start="37.05" data-duration="1.2"><span class="pill">Als Mieter bekommt er</span></div>

    <div id="cp24" class="cap clip" data-start="39.83" data-duration="1.02"><span class="pill">und Zeit,</span></div>

    <div id="cp26" class="cap clip" data-start="42.85" data-duration="0.94"><span class="pill">Wochenende,</span></div>
    <div id="cp27" class="cap clip" data-start="43.8" data-duration="1.66"><span class="pill">15. auf 16.</span></div>
    <div id="cp28" class="cap clip" data-start="45.47" data-duration="1.58"><span class="pill">Februar 2003.</span></div>

    <div id="cp30" class="cap clip" data-start="48.98" data-duration="1.2"><span class="pill">Komplizen dringen in</span></div>

    <div id="cp34" class="cap clip" data-start="53.97" data-duration="0.85"><span class="pill">über den Fall,</span></div>
